name: lapangku
description: Aplikasi booking lapangan olahraga LapangKu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  
  go_router: ^14.3.0

  
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  gap: ^3.0.1
  firebase_app_check: ^0.3.2+10

  
  fl_chart: ^1.2.0
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  

flutter:
  uses-material-design: true