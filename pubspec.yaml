name: lapangku
description: Aplikasi booking lapangan olahraga LapangKu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  
  go_router: ^14.3.0

  
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  intl: ^0.19.0
  gap: ^3.0.1
  firebase_app_check: ^0.3.2+10

  
  fl_chart: ^1.2.0
  google_sign_in: 6.2.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.17.0
  url_launcher: ^6.3.2
  email_otp: ^3.1.0
  http: ^1.6.0
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  universal_html: ^2.3.0
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  path: any
  shimmer: ^3.0.0
  gal: ^2.3.2
  flutter_dotenv: ^5.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.1
  very_good_analysis: ^10.2.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1B6B3A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - .env